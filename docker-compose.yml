services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: digital-nurse-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: digital-nurse-redis
    ports:
      - "6379:6379"

volumes:
  qdrant_data:
